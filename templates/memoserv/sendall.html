{% extends "base.html" %}
{% block title %}MemoServ — Send to All{% endblock %}
{% block content %}
<div class="max-w-sm">
  <div class="mb-5">
    <div class="page-title">Send Memo to All Users</div>
    <div class="page-subtitle">Oper — sends a memo to every registered account on the network.</div>
  </div>
  <form method="POST" class="card p-5" style="border-color:var(--danger); display:flex; flex-direction:column; gap:1rem;">
    <textarea name="text" rows="4" required placeholder="Memo text" class="form-input"></textarea>
    <button type="submit" class="btn btn-danger" style="width:100%; justify-content:center;"
            onclick="return confirm('Send this memo to every registered user on the network?');">
      Send to All
    </button>
  </form>
</div>
{% endblock %}
