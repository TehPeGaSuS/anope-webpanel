{% extends "base.html" %}
{% block title %}MemoServ — Send Memo{% endblock %}
{% block content %}
<div class="max-w-sm">
  <h1 class="page-title mb-1">Send Memo</h1>
  <p class="page-subtitle mb-6">Send a memo to a nick or channel.</p>
  <form method="POST" class="card p-5" style="display: flex; flex-direction: column; gap: 1rem;">
    <div>
      <label class="block text-xs font-medium" style="color:var(--text-muted); margin-bottom:0.375rem;">To</label>
      <input type="text" name="target" required autofocus placeholder="Nick or #channel"
             class="form-input" style="margin-bottom:0;">
    </div>
    <div>
      <label class="block text-xs font-medium" style="color:var(--text-muted); margin-bottom:0.375rem;">Message</label>
      <textarea name="message" required rows="4"
                class="form-input" style="resize:none; margin-bottom:0; font-family:'JetBrains Mono',monospace;"></textarea>
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">
      Send
    </button>
  </form>
</div>
{% endblock %}
