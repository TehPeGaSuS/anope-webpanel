{% extends "base.html" %}
{% block title %}MemoServ — Memo #{{ num }}{% endblock %}
{% block content %}
<div style="max-width:700px;">
  <div style="display:flex; align-items:center; gap:0.5rem; margin-bottom:1.5rem;">
    <a href="{{ url_for('memoserv.index') }}"
       style="color:var(--text-muted); text-decoration:none; font-size:0.85rem;">Memos</a>
    <span style="color:var(--text-muted);">/</span>
    <span style="color:var(--text); font-size:0.85rem;">Memo #{{ num }}</span>
  </div>

  <div class="card p-4 mb-4">
    {% if lines %}
      {% for line in lines %}
      <div style="color:var(--text); font-size:0.9rem; line-height:1.6;">{{ line }}</div>
      {% endfor %}
    {% else %}
    <div style="color:var(--text-muted); font-size:0.85rem;">Could not load memo.</div>
    {% endif %}
  </div>

  <div style="display:flex; gap:0.5rem;">
    <form method="POST" action="{{ url_for('memoserv.delete') }}">
      <input type="hidden" name="num" value="{{ num }}">
      <button type="submit" class="btn btn-danger">Delete</button>
    </form>
    <a href="{{ url_for('memoserv.index') }}" class="btn btn-secondary">Back</a>
  </div>
</div>
{% endblock %}
