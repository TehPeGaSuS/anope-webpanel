{% extends "base.html" %}
{% block title %}MemoServ — Memo #{{ num }}{% endblock %}
{% block content %}
<div class="max-w-2xl">
  <div class="flex items-center gap-2 mb-6">
    <a href="{{ url_for('memoserv.index') }}" class="text-zinc-500 hover:text-zinc-300 text-sm transition-colors">Memos</a>
    <span class="text-zinc-700">/</span>
    <span class="text-zinc-400 text-sm">#{{ num }}</span>
  </div>
  <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-5">
    {% if result %}
      {% for line in result %}
      <p class="text-sm text-zinc-300">{{ line }}</p>
      {% endfor %}
    {% else %}
    <p class="text-sm text-zinc-500">Could not load memo.</p>
    {% endif %}
  </div>
  <div class="mt-4 flex gap-3">
    <form method="POST" action="{{ url_for('memoserv.delete') }}">
      <input type="hidden" name="num" value="{{ num }}">
      <button type="submit" class="text-xs px-3 py-1.5 bg-zinc-800 hover:bg-red-900 text-red-400 rounded-lg transition-colors">
        Delete
      </button>
    </form>
    <a href="{{ url_for('memoserv.index') }}" class="text-xs px-3 py-1.5 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded-lg transition-colors">
      Back
    </a>
  </div>
</div>
{% endblock %}
