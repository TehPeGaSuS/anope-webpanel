{% extends "base.html" %}
{% block title %}HostServ — VHost{% endblock %}
{% block content %}
<div class="max-w-sm">
  <h1 class="text-lg font-semibold text-zinc-100 mb-1">VHost</h1>
  <p class="text-sm text-zinc-500 mb-6">Request a virtual hostname for your account.</p>

  {% if account and account.get('vhost') %}
  <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-4 mb-6">
    <div class="text-xs text-zinc-500 mb-1">Current VHost</div>
    <div class="font-mono text-sm text-sky-400">{{ account.vhost }}</div>
  </div>
  {% endif %}

  <form method="POST" class="bg-zinc-900 border border-zinc-800 rounded-xl p-5 space-y-4">
    <div>
      <label class="block text-xs font-medium text-zinc-400 mb-1.5">Requested VHost</label>
      <input type="text" name="vhost" required autofocus placeholder="yourhost.example.com"
             class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2
                    text-sm font-mono text-zinc-100 placeholder-zinc-600
                    focus:outline-none focus:ring-2 focus:ring-sky-500">
    </div>
    <button type="submit"
            class="w-full bg-sky-600 hover:bg-sky-500 text-white text-sm font-medium py-2 rounded-lg transition-colors">
      Submit request
    </button>
  </form>
</div>
{% endblock %}
