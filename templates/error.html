{% extends "base.html" %}
{% block title %}{{ code }} — Anope Web{% endblock %}
{% block content %}
<div style="max-width:480px; margin:3rem auto 0; text-align:center;">
  <div class="font-mono" style="font-size:3rem; font-weight:600; color:var(--accent); line-height:1;">{{ code }}</div>
  <div class="page-title" style="margin-top:0.75rem;">{{ title }}</div>
  <div class="page-subtitle" style="margin-top:0.5rem;">{{ message }}</div>
  <div class="mt-6">
    <a href="{{ url_for('dashboard') if session.get('account') else url_for('auth.login') }}" class="btn btn-primary">
      {{ 'Back to Dashboard' if session.get('account') else 'Back to Login' }}
    </a>
  </div>
</div>
{% endblock %}
