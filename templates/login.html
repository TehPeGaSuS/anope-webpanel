<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Anope Web Control Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { background:#0d1117; color:#e6edf3; font-family:'Inter',sans-serif; }
    .form-input {
      background:#0d1117; border:1px solid #30363d; border-radius:4px;
      padding:0.5rem 0.75rem; font-size:0.9rem; color:#e6edf3; width:100%;
    }
    .form-input:focus { outline:none; border-color:#1f6feb; }
    .form-input::placeholder { color:#484f58; }
  </style>
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh;">
  <div style="width:100%; max-width:360px; padding:0 1rem;">

    <div style="text-align:center; margin-bottom:2rem;">
      <div style="font-family:'JetBrains Mono',monospace; font-weight:700; color:#58a6ff; font-size:1.1rem; letter-spacing:0.05em;">ANOPE WEB</div>
      <div style="font-size:0.75rem; text-transform:uppercase; letter-spacing:0.1em; color:#7d8590; margin-top:0.25rem;">Control Panel</div>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div style="margin-bottom:1rem;">
          {% for category, message in messages %}
          <div style="padding:0.6rem 0.75rem; border-radius:4px; font-size:0.85rem; margin-bottom:0.5rem;
            {% if category == 'error' %}background:#3d1c1c; border:1px solid #f85149; color:#ff7b72;
            {% else %}background:#1a3a2a; border:1px solid #3fb950; color:#56d364;{% endif %}">
            {{ message }}
          </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <div style="background:#161b22; border:1px solid #30363d; border-radius:6px; padding:1.5rem;">
      <form method="POST">
        <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
        <div style="margin-bottom:1rem;">
          <label style="display:block; font-size:0.8rem; font-weight:500; color:#7d8590; margin-bottom:0.4rem;">Nick / Account</label>
          <input type="text" name="username" autocomplete="username" autofocus class="form-input" placeholder="YourNick">
        </div>
        <div style="margin-bottom:1.25rem;">
          <label style="display:block; font-size:0.8rem; font-weight:500; color:#7d8590; margin-bottom:0.4rem;">Password</label>
          <input type="password" name="password" autocomplete="current-password" class="form-input" placeholder="••••••••">
        </div>
        <button type="submit" style="width:100%; background:#1f6feb; color:#fff; border:none; border-radius:4px;
               padding:0.55rem; font-size:0.85rem; font-weight:600; cursor:pointer; letter-spacing:0.04em;
               text-transform:uppercase;">
          Sign in
        </button>
      </form>
    </div>

    <div style="text-align:center; margin-top:1rem;">
      <a href="{{ url_for('nickserv.reset') }}" style="font-size:0.8rem; color:#7d8590; text-decoration:none;">Forgot password?</a>
    </div>
  </div>
</body>
</html>
