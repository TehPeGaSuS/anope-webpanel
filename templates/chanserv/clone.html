{% extends "base.html" %}
{% block title %}ChanServ — {{ channel }} Clone{% endblock %}
{% block content %}
<div style="max-width:600px;">
  <div class="mb-5">
    <div class="page-title">Clone Channel</div>
    <div class="page-subtitle">Copy settings from {{ channel }} to another channel you own.</div>
  </div>

  <div class="card p-4 mb-5">
    <form method="POST" class="space-y-3">
      <div>
        <label style="display:block; font-size:0.8rem; color:#7d8590; margin-bottom:0.4rem;">Target channel</label>
        <input type="text" name="target" placeholder="#target-channel"
               class="form-input font-mono" required>
      </div>
      <div>
        <label style="display:block; font-size:0.8rem; color:#7d8590; margin-bottom:0.4rem;">What to clone (blank = everything)</label>
        <select name="what" class="form-input">
          <option value="">Everything</option>
          <option value="ACCESS">ACCESS only</option>
          <option value="AKICK">AKICK only</option>
          <option value="BADWORDS">BADWORDS only</option>
          <option value="LEVELS">LEVELS only</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary">Clone</button>
    </form>
  </div>

  {% if result %}
  <div class="card p-4">
    <div class="section-title">Result</div>
    {% for line in result %}
    <div style="color:#3fb950; font-size:0.85rem; padding:0.2rem 0;">✓ {{ line }}</div>
    {% endfor %}
  </div>
  {% endif %}
</div>
{% endblock %}
