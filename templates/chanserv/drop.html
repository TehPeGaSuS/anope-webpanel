{% extends "base.html" %}
{% block title %}ChanServ — Drop {{ channel }}{% endblock %}
{% block content %}
<div class="max-w-sm">
  <h1 class="page-title mb-1">Drop Channel</h1>
  <p class="page-subtitle mb-6">This is permanent. Type the channel name to confirm.</p>
  <form method="POST" class="card p-5" style="border-color:var(--danger); display: flex; flex-direction: column; gap: 1rem;">
    <div>
      <label class="block text-xs font-medium" style="color:var(--text-muted); margin-bottom:0.375rem;">Type <span class="font-mono" style="color:var(--danger);">{{ channel }}</span> to confirm</label>
      <input type="text" name="confirm" required autofocus class="form-input font-mono" style="margin-bottom:0;">
    </div>
    <button type="submit" class="btn btn-danger" style="width:100%; justify-content:center;">
      Drop {{ channel }}
    </button>
  </form>
</div>
{% endblock %}
