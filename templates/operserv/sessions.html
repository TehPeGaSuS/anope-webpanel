{% extends "base.html" %}
{% block title %}OperServ — Sessions{% endblock %}
{% block content %}
<div style="max-width:900px;">
  <div class="mb-5">
    <div class="page-title">Sessions</div>
    <div class="page-subtitle">Hosts with multiple connections.</div>
  </div>
  <div class="card p-4">
    {% if result %}
    {% for line in result %}
    <div class="font-mono" style="font-size:0.82rem; color:#c9d1d9; padding:0.2rem 0;">{{ line }}</div>
    {% endfor %}
    {% else %}
    <div style="color:#7d8590; font-size:0.85rem;">No session data.</div>
    {% endif %}
  </div>
</div>
{% endblock %}
