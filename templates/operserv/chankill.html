{% extends "base.html" %}
{% block title %}OperServ — Chankill{% endblock %}
{% block content %}
<div class="max-w-sm">
  <div class="mb-5">
    <div class="page-title">Chankill</div>
    <div class="page-subtitle">AKILLs every user currently on a channel, by ident@host, and enforces it immediately.</div>
  </div>
  <form method="POST" class="card p-5" style="border-color:var(--danger); display:flex; flex-direction:column; gap:1rem;">
    <div>
      <label class="block text-xs font-medium" style="color:var(--text-muted); margin-bottom:0.375rem;">Channel</label>
      <input type="text" name="channel" required placeholder="#channel" class="form-input font-mono">
    </div>
    <div>
      <label class="block text-xs font-medium" style="color:var(--text-muted); margin-bottom:0.375rem;">Expiry (optional, e.g. 1d — blank uses server default)</label>
      <input type="text" name="expiry" class="form-input font-mono">
    </div>
    <div>
      <label class="block text-xs font-medium" style="color:var(--text-muted); margin-bottom:0.375rem;">Reason</label>
      <input type="text" name="reason" required class="form-input">
    </div>
    <button type="submit" class="btn btn-danger" style="width:100%; justify-content:center;"
            onclick="return confirm('This will AKILL every user currently in this channel. Continue?');">
      Chankill
    </button>
  </form>
</div>
{% endblock %}
