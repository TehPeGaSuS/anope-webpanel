{% extends "base.html" %}
{% block title %}OperServ — Force Mode{% endblock %}
{% block content %}
<div style="max-width:500px;">
  <div class="mb-5">
    <div class="page-title">Force Mode</div>
    <div class="page-subtitle">Change modes on any channel or user, bypassing normal restrictions.</div>
  </div>

  <div class="card mb-5 p-5">
    <div class="section-title">Channel Mode</div>
    <form method="POST" action="{{ url_for('operserv.mode') }}" style="display:flex; flex-direction:column; gap:1rem;">
      <input type="hidden" name="kind" value="channel">
      <div>
        <label class="block text-xs font-medium" style="color:var(--text-muted); margin-bottom:0.375rem;">Channel</label>
        <input type="text" name="target" required placeholder="#channel" class="form-input font-mono">
      </div>
      <div>
        <label class="block text-xs font-medium" style="color:var(--text-muted); margin-bottom:0.375rem;">Modes (or "CLEAR" / "CLEAR ALL")</label>
        <input type="text" name="modes" required placeholder="+im-k" class="form-input font-mono">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Apply</button>
    </form>
  </div>

  <div class="card p-5">
    <div class="section-title">User Mode</div>
    <form method="POST" action="{{ url_for('operserv.mode') }}" style="display:flex; flex-direction:column; gap:1rem;">
      <input type="hidden" name="kind" value="user">
      <div>
        <label class="block text-xs font-medium" style="color:var(--text-muted); margin-bottom:0.375rem;">Nick</label>
        <input type="text" name="target" required class="form-input font-mono">
      </div>
      <div>
        <label class="block text-xs font-medium" style="color:var(--text-muted); margin-bottom:0.375rem;">Modes</label>
        <input type="text" name="modes" required placeholder="+i" class="form-input font-mono">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Apply</button>
    </form>
  </div>
</div>
{% endblock %}
