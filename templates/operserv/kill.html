{% extends "base.html" %}
{% block title %}OperServ — Kill{% endblock %}
{% block content %}
<div style="max-width:500px;">
  <div class="mb-5">
    <div class="page-title">Kill</div>
    <div class="page-subtitle">Force-disconnect a currently connected user from the network.</div>
  </div>

  <div class="card p-5" style="border-color:var(--danger);">
    <form method="POST" action="{{ url_for('operserv.kill') }}"
          style="display:flex; flex-direction:column; gap:1rem;"
          onsubmit="return confirm('Kill this user from the network?');">
      <div>
        <label class="block text-xs font-medium" style="color:var(--text-muted); margin-bottom:0.375rem;">Nick</label>
        <input type="text" name="target" required class="form-input font-mono">
      </div>
      <div>
        <label class="block text-xs font-medium" style="color:var(--text-muted); margin-bottom:0.375rem;">Reason (optional)</label>
        <input type="text" name="reason" class="form-input">
      </div>
      <button type="submit" class="btn btn-danger" style="width:100%; justify-content:center;">Kill</button>
    </form>
  </div>
</div>
{% endblock %}
