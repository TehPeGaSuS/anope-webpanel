{% extends "base.html" %}
{% block title %}OperServ — News{% endblock %}
{% block content %}
<div style="max-width:900px;">
  <div class="mb-5">
    <div class="page-title">News</div>
    <div class="page-subtitle">Network news entries.</div>
  </div>
  <div class="card p-4">
    {% if result %}
    {% for line in result %}
    <div class="font-mono" style="font-size:0.82rem; color:var(--text); padding:0.2rem 0;">{{ line }}</div>
    {% endfor %}
    {% else %}
    <div style="color:var(--text-muted); font-size:0.85rem;">No news entries.</div>
    {% endif %}
  </div>
</div>
{% endblock %}
