{% extends "base.html" %}
{% block title %}OperServ — Jupe{% endblock %}
{% block content %}
<div class="max-w-sm">
  <div class="mb-5">
    <div class="page-title">Jupe Server</div>
    <div class="page-subtitle">Creates a fake server to block the real one from connecting. Remove with a standard SQUIT.</div>
  </div>
  <form method="POST" class="card p-5" style="border-color:var(--danger); display:flex; flex-direction:column; gap:1rem;">
    <div>
      <label class="block text-xs font-medium" style="color:var(--text-muted); margin-bottom:0.375rem;">Server name</label>
      <input type="text" name="server" required placeholder="irc.example.org" class="form-input font-mono">
    </div>
    <div>
      <label class="block text-xs font-medium" style="color:var(--text-muted); margin-bottom:0.375rem;">Reason (optional)</label>
      <input type="text" name="reason" class="form-input">
    </div>
    <button type="submit" class="btn btn-danger" style="width:100%; justify-content:center;"
            onclick="return confirm('This will jupiter the server, preventing it from connecting. Continue?');">
      Jupe
    </button>
  </form>
</div>
{% endblock %}
