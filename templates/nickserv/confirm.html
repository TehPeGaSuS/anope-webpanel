{% extends "base.html" %}
{% block title %}NickServ — Confirm Email{% endblock %}
{% block content %}
<div class="max-w-sm">
  <h1 class="page-title mb-1">Confirm Email</h1>
  <p class="page-subtitle mb-6">Enter the code from your confirmation email.</p>
  <form method="POST" class="card p-5" style="display: flex; flex-direction: column; gap: 1rem;">
    <div>
      <label class="block text-xs font-medium" style="color:var(--text-muted); margin-bottom:0.375rem;">Confirmation code</label>
      <input type="text" name="code" required autofocus class="form-input font-mono" style="margin-bottom:0;">
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">
      Confirm
    </button>
  </form>
</div>
{% endblock %}
