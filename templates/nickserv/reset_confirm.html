{% extends "base.html" %}
{% block title %}Reset Password — Set New Password{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-12">
  <h1 class="text-lg font-semibold text-zinc-100 mb-1">Set New Password</h1>
  <p class="text-sm text-zinc-500 mb-6">Enter your nick and new password.</p>
  <form method="POST" class="bg-zinc-900 border border-zinc-800 rounded-xl p-5 space-y-4">
    <div>
      <label class="block text-xs font-medium text-zinc-400 mb-1.5">Nick / Account</label>
      <input type="text" name="username" required autofocus
             class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2
                    text-sm text-zinc-100 focus:outline-none focus:ring-2 focus:ring-sky-500">
    </div>
    <div>
      <label class="block text-xs font-medium text-zinc-400 mb-1.5">New password</label>
      <input type="password" name="password" required
             class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2
                    text-sm text-zinc-100 focus:outline-none focus:ring-2 focus:ring-sky-500">
    </div>
    <button type="submit"
            class="w-full bg-sky-600 hover:bg-sky-500 text-white text-sm font-medium py-2 rounded-lg transition-colors">
      Reset password
    </button>
  </form>
</div>
{% endblock %}
