{% extends "base.html" %}
{% block title %}Reset Password — Set New Password{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-12">
  <h1 class="page-title mb-1">Set New Password</h1>
  <p class="page-subtitle mb-6">Choose a new password for <span class="font-mono" style="color:var(--text);">{{ nick }}</span>.</p>
  <form method="POST" class="card p-5" style="display: flex; flex-direction: column; gap: 1rem;">
    <div>
      <label class="block text-xs font-medium" style="color:var(--text-muted); margin-bottom:0.375rem;">New password</label>
      <input type="password" name="password" required autofocus class="form-input" style="margin-bottom:0;">
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">
      Reset password
    </button>
  </form>
</div>
{% endblock %}
