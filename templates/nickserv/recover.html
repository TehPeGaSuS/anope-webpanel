{% extends "base.html" %}
{% block title %}NickServ — Recover Nick{% endblock %}
{% block content %}
<div class="max-w-sm">
  <h1 class="page-title mb-1">Recover a Nick</h1>
  <p class="page-subtitle mb-6">Reclaim a nick that's currently held by services or another user.</p>
  <form method="POST" class="card p-5" style="display:flex; flex-direction:column; gap:1rem;">
    <div>
      <label class="block text-xs font-medium" style="color:var(--text-muted); margin-bottom:0.375rem;">Nick to recover</label>
      <input type="text" name="nick" required autofocus class="form-input font-mono" style="margin-bottom:0;">
    </div>
    <div>
      <label class="block text-xs font-medium" style="color:var(--text-muted); margin-bottom:0.375rem;">Password (only needed if it's not yours)</label>
      <input type="password" name="password" class="form-input" style="margin-bottom:0;">
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Recover</button>
  </form>
</div>
{% endblock %}
