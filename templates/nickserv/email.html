{% extends "base.html" %}
{% block title %}NickServ — Change Email{% endblock %}
{% block content %}
<div class="max-w-sm">
  <h1 class="text-lg font-semibold text-zinc-100 mb-1">Change Email</h1>
  <p class="text-sm text-zinc-500 mb-6">A confirmation will be sent to your new address.</p>
  <form method="POST" class="bg-zinc-900 border border-zinc-800 rounded-xl p-5 space-y-4">
    <div>
      <label class="block text-xs font-medium text-zinc-400 mb-1.5">New email address</label>
      <input type="email" name="email" required autofocus
             class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2
                    text-sm text-zinc-100 placeholder-zinc-600
                    focus:outline-none focus:ring-2 focus:ring-sky-500">
    </div>
    <button type="submit"
            class="w-full bg-sky-600 hover:bg-sky-500 text-white text-sm font-medium py-2 rounded-lg transition-colors">
      Update email
    </button>
  </form>
</div>
{% endblock %}
