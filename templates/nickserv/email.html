{% extends "base.html" %}
{% block title %}NickServ — Change Email{% endblock %}
{% block content %}
<div class="max-w-sm">
  <h1 class="page-title mb-1">Change Email</h1>
  <p class="page-subtitle mb-6">A confirmation will be sent to your new address.</p>
  <form method="POST" class="card p-5" style="display: flex; flex-direction: column; gap: 1rem;">
    <div>
      <label class="block text-xs font-medium" style="color:var(--text-muted); margin-bottom:0.375rem;">New email address</label>
      <input type="email" name="email" required autofocus class="form-input" style="margin-bottom:0;">
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">
      Update email
    </button>
  </form>
</div>
{% endblock %}
